name: Build and Package

permissions:
  contents: read

on:
  push:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  config: Release
  out_folder: ./build-out/
  solution_name: ./uSync.Forms.slnx
  forms_client_folder: ./uSync.Forms/forms-client
  forms_project: ./uSync.Forms/uSync.Forms.csproj
  complete_project: ./uSync.Forms.Complete/uSync.Forms.Complete.csproj

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_string: ${{ steps.gitversion.outputs.fullSemVer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        # pinned to v3 on purpose: v4 of this action requires GitVersion >= 6.2, and our
        # GitVersion.yml is still v5 schema (mode / tag rather than deployment-mode / label).
        # Moving to v4 means migrating that config too.
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: ./GitVersion.yml

      # block scalar, not a plain one - the ": " inside the string would otherwise be
      # read as the start of a nested mapping.
      - name: Display version
        run: |
          echo "Full Version: ${{ steps.gitversion.outputs.fullSemVer }}"

  package-up:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # forms-client has no MSBuild target wiring it into the dotnet build, unlike
      # uSync.Forms.Complete's Client folder, so it has to be built explicitly first.
      - name: build forms-client
        run: |
          npm ci
          npm run build
        working-directory: ${{ env.forms_client_folder }}

      - name: restore
        run: dotnet restore ${{ env.solution_name }} --locked-mode

      - name: build
        run: >
          dotnet build ${{ env.solution_name }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true

      # deliberately not --no-build: the version has to be stamped onto the assembly as
      # well as the nuspec, so these steps rebuild with it.
      - name: package uSync.Forms
        run: >
          dotnet pack ${{ env.forms_project }}
          -c ${{ env.config }}
          --output ${{ env.out_folder }}
          /p:version=${{ needs.version.outputs.version_string }}
          -p:ContinuousIntegrationBuild=true

      - name: package uSync.Forms.Complete
        run: >
          dotnet pack ${{ env.complete_project }}
          -c ${{ env.config }}
          --output ${{ env.out_folder }}
          /p:version=${{ needs.version.outputs.version_string }}
          -p:ContinuousIntegrationBuild=true

      # NOTE: intentionally no `dotnet nuget push` here - this workflow builds packages
      # for review on every push to a release branch and does not release. Publishing
      # happens in release.yml, triggered by pushing a v{version} tag.
      - name: Upload nuget packages as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-build-output
          path: ${{ env.out_folder }}
