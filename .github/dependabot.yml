version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Umbraco versions are locked to the release we've pinned across the .NET
      # projects and package.json (see "Pin @umbraco-cms/backoffice to the 17.4.2
      # release") - bump these deliberately, not via dependabot.
      - dependency-name: "Umbraco.*"
      # uSync and uSync.Complete are ours and set the minimum for anyone installing
      # uSync.Forms, so they move with the Umbraco major too.
      - dependency-name: "uSync*"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/uSync.Forms/forms-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@umbraco-cms/*"
      # TypeScript 7 is not supported by @hey-api yet - stay on the current major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @hey-api/* is still 0.x, so a minor bump is a breaking one.
      - dependency-name: "@hey-api/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/uSync.Forms.Complete/Client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@umbraco-cms/*"
      # TypeScript 7 is not supported by @hey-api yet - stay on the current major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @hey-api/* is still 0.x, so a minor bump is a breaking one.
      - dependency-name: "@hey-api/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v4 needs GitVersion >= 6.2 and our GitVersion.yml is still v5 schema -
      # see the comment in package-build.yml. Migrate deliberately, not via dependabot.
      - dependency-name: "gittools/actions"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
