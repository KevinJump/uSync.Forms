version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # this branch targets Umbraco 17 - don't suggest jumping major versions
      - dependency-name: "Umbraco.Cms*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Umbraco.Forms*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/uSync.Forms/forms-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@umbraco-cms/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/uSync.Forms.Complete/Client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@umbraco-cms/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v4 needs GitVersion >= 6.2 and our GitVersion.yml is still v5 schema -
      # see the comment in package-build.yml. Migrate deliberately, not via dependabot.
      - dependency-name: "gittools/actions"
        update-types: ["version-update:semver-major"]
